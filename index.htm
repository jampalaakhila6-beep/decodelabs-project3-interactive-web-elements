<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>DecodeLabs Project 3</h1>
        <p>Interactive Web Elements</p>
    </header>

    <main>

        <section class="card">
            <h2>🌙 Dark Mode Toggle</h2>
            <button id="themeBtn">Enable Dark Mode</button>
        </section>

        <section class="card">
            <h2>🔢 Counter App</h2>

            <h1 id="counter">0</h1>

            <div class="buttons">
                <button id="increase">+</button>
                <button id="decrease">-</button>
                <button id="reset">Reset</button>
            </div>
        </section>

        <section class="card">
            <h2>💬 Dynamic Message</h2>

            <button id="messageBtn">
                Show Message
            </button>

            <p id="message"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 DecodeLabs Internship</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
